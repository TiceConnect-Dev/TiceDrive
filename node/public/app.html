<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace Documents</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000091">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Documents">
<link rel="stylesheet" href="app.css">
<script src="common.js"></script>
<script src="vendor/qrcode.js" defer></script>
</head>
<body>
<header class="hd">
  <div class="hd-in">
    <button class="btn-icon show-m" id="burger" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
    <a class="brand" href="#" id="brandLink">
      <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></div>
      <div><strong id="appName">Espace Documents</strong><small>Stockage et partage de fichiers</small></div>
    </a>
    <form class="search" id="searchForm" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <input id="q" type="search" placeholder="Rechercher dans mes documents" aria-label="Rechercher" autocomplete="off">
      <button type="submit" class="hide-m">Rechercher</button>
    </form>
    <div class="hd-tools">
      <button class="btn-icon hide-m" id="themeBtn" title="Thème clair / sombre"></button>
      <button class="user-btn" id="userBtn" aria-haspopup="menu"><span class="av" id="userAv">··</span><span class="un" id="userName"></span></button>
    </div>
  </div>
</header>

<div class="app">
  <aside class="side" id="side">
    <button class="btn btn-primary new-btn" id="newBtn" aria-haspopup="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>Nouveau</button>
    <ul class="nav" id="nav"></ul>
    <div class="quota" id="quota"></div>
  </aside>

  <main class="main" id="main">
    <div class="toolbar">
      <div class="crumbs">
        <ol id="crumbs"></ol>
        <h1 class="title" id="title"><span>Mon espace</span></h1>
      </div>
      <div class="tools" id="tools">
        <select class="sel hide-m" id="sort" aria-label="Trier par">
          <option value="name">Nom</option>
          <option value="modified">Modification</option>
          <option value="size">Taille</option>
          <option value="type">Type</option>
        </select>
        <button class="btn-icon" id="sortDir" title="Inverser l'ordre"></button>
        <div class="seg"><button id="vGrid" title="Affichage en grille"></button><button id="vList" title="Affichage en liste"></button></div>
        <button class="btn-icon" id="infoBtn" title="Afficher les détails"></button>
      </div>
    </div>
    <div class="selbar" id="selbar"></div>
    <div class="banner" id="banner"></div>
    <div class="content" id="content" tabindex="-1"></div>
    <div class="dropzone" id="dropzone"><div><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 10A7.5 7.5 0 0 0 5.4 8 6 6 0 0 0 6 20h13a5 5 0 0 0 .4-10zM14 13v4h-4v-4H7l5-5 5 5z"/></svg><span id="dropTxt">Déposez vos fichiers pour les envoyer</span></div></div>
  </main>

  <aside class="details" id="details" aria-label="Détails"></aside>
</div>

<input type="file" id="fileIn" multiple hidden>
<input type="file" id="folderIn" webkitdirectory multiple hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<button class="fab" id="fab" aria-label="Nouveau"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
<div class="menu" id="newMenu" role="menu"></div>
<div class="menu" id="ctx" role="menu"></div>
<div class="menu" id="userMenu" role="menu"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
